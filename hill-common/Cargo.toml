[package]
name = "hill-common"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "^0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "rust_decimal"] }
sea-orm = { version = "2.0.1", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
rust_decimal = { version = "1.35.0", features = ["serde-float"] }
serde = { version = "1.0.203", features = ["derive"] }
tracing = "0.1.40"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.38", features = ["sync"] }
base64 = "0.23.1"
aes-gcm = "0.11.0"
thiserror = "2"
