[package]
name = "hill-pdv"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "2.0.1", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
tracing = "0.1.40"
hill-common = { path = "../hill-common" }
hill-concentrador = { path = "../hill-concentrador" }
hex = "0.4"
scrypt = "0.12.0"
uuid = { version = "1.8.0", features = ["serde", "v4"] }
rust_decimal = { version = "1.35.0", features = ["serde-float"] }
