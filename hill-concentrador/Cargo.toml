[package]
name = "hill-concentrador"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1.40"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "rust_decimal"] }
sea-orm = { version = "2.0.1", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
rust_decimal = { version = "1.35.0", features = ["serde-float"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0"
serialport = "4.3.0"
hill-common = { path = "../hill-common" }
